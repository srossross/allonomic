final_response: >-
  Here is the detailed verification, validation, and evaluation of each comment
  from the Copilot code review.


  ---


  ### **Comment 1: Do not skip tests for unrelated DuckDB attach errors**

  - **File:** `integration_tests/test_crossing_sqlite_source.py` (lines 43–44)

  - **Reviewer Note:**
    > *"Catching every `duckdb.Error` turns any regression in n6k attach, catalog discovery, or protocol handling into a skipped test, so this new suite can report success while the feature is broken. Skip only when the error is confirmed to be sqlite-extension unavailability and re-raise all other attach failures."*

  #### **Evaluation & Validation: ✅ Valid (High/Medium Value)**

  - **Current code:**
    ```python
    try:
        c.execute("ATTACH 'n6k://localhost:8099' AS sqlite_db (TYPE n6k)")
    except duckdb.Error as error:
        pytest.skip(f"the server could not serve a sqlite catalog: {error}")
    ```
  - **Analysis:**
    - The docstring for `seed_sqlite` explains the intent: *"Raises if the sqlite extension cannot be installed; the client then fails to attach and the test that wanted it skips."*
    - However, catching a blanket `duckdb.Error` during `ATTACH ... (TYPE n6k)` means **any** failure (e.g., handshake / protocol bugs, catalog discovery crashes, connection resets, authorization errors, or syntax errors) will silently skip the entire test suite rather than fail the build.
    - In CI or developer environments where `sqlite` is actually installed or expected to work, broken n6k features would show up as green passes with 1 skipped file.
    - **Recommendation:** Check whether the error string indicates sqlite extension failure (e.g. `"sqlite"` or `"Extension"` or specific message from DuckDB), or inspect `str(error).lower()`. If it's unrelated to sqlite availability, re-raise the exception so test failures are accurately surfaced.

  ---


  ### **Comment 2: Clean up temporary SQLite directories after database
  teardown**

  - **File:** `packages/python/src/n6k_server/test_server/seeding.py` (line 71)

  - **Reviewer Note:**
    > *"`mkdtemp()` creates a directory that is never removed. Because `seed_sqlite` runs once for every `sqlite_db` WebSocket connection, repeated integration sessions leave an unbounded number of `n6k_sqlite_*` directories and database files behind even after the DuckDB connection closes. Keep the temporary-directory owner alive through `_open_db` and remove it during that generator's teardown."*

  #### **Evaluation & Validation: ✅ Valid (Medium Value)**

  - **Current code:**
    In `seeding.py`:
    ```python
    def seed_sqlite(con: duckdb.DuckDBPyConnection, catalog: str) -> None:
        con.execute("INSTALL sqlite; LOAD sqlite")
        path = os.path.join(tempfile.mkdtemp(prefix="n6k_sqlite_"), f"{catalog}.sqlite")
        con.execute(f"ATTACH '{path}' AS \"{catalog}\" (TYPE sqlite)")
        ...
    ```
    In `app.py`:
    ```python
    def _native_con(catalog: str) -> duckdb.DuckDBPyConnection:
        ...
        if catalog == SQLITE_CATALOG:
            seed_sqlite(con, catalog)
            return con
    ```
    `_open_db()` is an async generator:
    ```python
    async def _open_db(...) -> AsyncIterator[duckdb.DuckDBPyConnection]:
        con = _native_con(catalog)
        ...
        try:
            yield con
        finally:
            _live.pop(key, None)
    ```
  - **Analysis:**
    - `tempfile.mkdtemp()` allocates a directory on disk that Python does **not** automatically clean up on exit or garbage collection.
    - The test server is a persistent daemon running on `:8099`. Every time an integration test connects to `sqlite_db`, a new directory and sqlite database file are created under `/tmp/n6k_sqlite_*` and left behind indefinitely.
    - Either:
      - `seed_sqlite` can use `tempfile.TemporaryDirectory()` whose handle is attached to `con` (or returned alongside `con` so `_open_db`'s `finally:` block cleans it up with `.cleanup()` or `shutil.rmtree()`), OR
      - Use an in-memory SQLite database if DuckDB's sqlite extension supports it: `ATTACH ':memory:' AS sqlite_db (TYPE sqlite)` or `ATTACH '' AS sqlite_db (TYPE sqlite)` (though DuckDB's sqlite scanner typically requires a file or specific syntax), OR
      - Clean up the directory in `_open_db`'s `finally:` block.
    - **Recommendation:** Implement cleanup in `_open_db`'s `finally` block or manage `TemporaryDirectory` lifecycle to avoid leaking `/tmp` files during repeated integration test runs.

  ---


  ### **Comment 3: Correct empty grant inputs error message for policies API**

  - **File:** `packages/python/src/n6k_server/bridge.py` (lines 104–105)

  - **Reviewer Note:**
    > *"This message is now misleading for callers of the new `policies` API: `policies=[]` reports that “permissions cannot be empty” even though no permissions argument was intended. Report that both grant inputs are empty (and update the matching test) so callers know how to correct the request."*

  #### **Evaluation & Validation: ✅ Valid (Low / Polish Value)**

  - **Current code:**
    ```python
    if permissions and policies:
        raise duckdb.InvalidInputException("bridge: pass permissions or policies, not both")
    if not permissions and not policies:
        raise duckdb.InvalidInputException("bridge: permissions cannot be empty")
    ```
    And the test in `test_bridge.py`:
    ```python
    def test_neither_permissions_nor_policies_rejected():
        with pytest.raises(duckdb.Error, match="permissions cannot be empty"):
            bridge(_source(), _target(), "workspace", source_catalog="memory")
    ```
  - **Analysis:**
    - When callers use the new API `bridge(..., policies=[])`, getting `"bridge: permissions cannot be empty"` is confusing because they didn't pass `permissions`.
    - Changing the error message to something like `"bridge: permissions or policies must be non-empty"` (or `"bridge: either permissions or policies must be provided and non-empty"`) makes the error message accurate for both usages.
    - This is trivial to fix and improves API ergonomics and clarity.

  ---


  ### **Conclusion & Recommended Action Plan**


  All 3 comments from the Copilot review are valid, accurate, and constructive:


  1. **Comment 1 (Attach Error Filtering):** Only catch/skip when the error is
  genuinely related to the `sqlite` extension; re-raise unexpected DuckDB
  errors.

  2. **Comment 2 (Tempdir Cleanup):** Pass back or store the temporary directory
  reference created by `seed_sqlite` and ensure `shutil.rmtree()` /
  `TemporaryDirectory.cleanup()` is executed in `_open_db` teardown.

  3. **Comment 3 (Error Message):** Update `"bridge: permissions cannot be
  empty"` to indicate both `permissions` and `policies` are empty/missing, and
  update the associated regex assertions in `test_bridge.py`.
